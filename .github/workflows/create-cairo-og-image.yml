name: Publish improved Facebook image with Cairo font
on:
  push:
    branches: [fix/facebook-preview-cairo-type]
    paths: [.github/workflows/create-cairo-og-image.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow and approved Cairo font
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user Pillow
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf' \
            -o /tmp/Cairo.ttf
          test $(wc -c < /tmp/Cairo.ttf) -gt 100000
      - name: Create 1200x630 social card
        shell: bash
        run: |
          set -euo pipefail
          CAIRO_FONT=/tmp/Cairo.ttf python3 tools/create_social_preview.py
          file public/assets/social-preview-v2.jpg
          test $(wc -c < public/assets/social-preview-v2.jpg) -lt 1500000
      - name: Upload preview for visual quality check
        uses: actions/upload-artifact@v4
        with:
          name: social-preview-cairo
          path: public/assets/social-preview-v2.jpg
          retention-days: 5
      - name: Commit updated OG card asset to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/social-preview-v2.jpg
          git commit -m "Add 1200x630 typography-correct OG image with original brand logo" || exit 0
          git push origin HEAD:fix/facebook-preview-cairo-type
