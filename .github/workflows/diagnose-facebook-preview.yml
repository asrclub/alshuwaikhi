name: Diagnose Facebook crawler sharing
on:
  push:
    branches: [fix/facebook-preview]
    paths: [.github/workflows/diagnose-facebook-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect OG metadata, image dimensions and public responses
        shell: bash
        run: |
          set -euo pipefail
          file public/assets/anniversary.png public/assets/logo.png
          identify public/assets/anniversary.png public/assets/logo.png 2>/dev/null || true
          for ua in "Mozilla/5.0" "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)"; do
            echo "== USER AGENT: $ua =="
            curl -sS -L --compressed -A "$ua" -o /tmp/shuwaikhi.html -w "HTML HTTP %{http_code} ContentType %{content_type} Bytes %{size_download} URL %{url_effective}\\n" --max-time 20 https://alshuwaikhi.pages.dev/ || true
            head -c 1450 /tmp/shuwaikhi.html 2>/dev/null || true
            echo
            curl -sS -L -A "$ua" -o /tmp/ogimage.png -w "IMAGE HTTP %{http_code} ContentType %{content_type} Bytes %{size_download}\\n" --max-time 20 https://alshuwaikhi.pages.dev/assets/anniversary.png || true
          done
          echo '== ROBOTS =='
          curl -sS -L -A facebookexternalhit -o /tmp/robots.txt -w "ROBOTS HTTP %{http_code} ContentType %{content_type}\\n" --max-time 20 https://alshuwaikhi.pages.dev/robots.txt || true
          head -c 500 /tmp/robots.txt 2>/dev/null || true
