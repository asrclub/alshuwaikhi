name: Generate Facebook preview image
on:
  push:
    branches: [fix/facebook-preview]
    paths:
      - tools/create_social_preview.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate social image from original brand assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user Pillow
          python3 tools/create_social_preview.py
          file public/assets/social-preview.jpg
          test $(wc -c < public/assets/social-preview.jpg) -lt 2000000
      - uses: actions/upload-artifact@v4
        with:
          name: social-preview-review
          path: public/assets/social-preview.jpg
          retention-days: 2
      - name: Commit image to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/social-preview.jpg
          git commit -m "Add optimized 1200x630 OG social preview for Facebook and WhatsApp" || exit 0
          git push origin HEAD:fix/facebook-preview
