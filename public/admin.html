<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الشويخي</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#100f0d;color:#f3eadb;font-family:Cairo,sans-serif}header{background:#1c1915;padding:18px 5%;border-bottom:1px solid #665031;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:22px;color:#e6bd71;margin:0}main{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:#201c18;border:1px solid #59462c;border-radius:16px;padding:22px;margin-bottom:20px}input,select{width:100%;background:#151311;color:white;border:1px solid #695438;border-radius:8px;padding:11px;font:inherit;min-width:0}label{display:block;font-size:13px;color:#d6c5a8;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid label{min-width:0}button{background:#d4a65b;color:#19130b;border:0;border-radius:9px;padding:11px 17px;font:700 13px Cairo;cursor:pointer}button.secondary{background:#3b3228;color:#f5e9d5}button.danger{background:#7d2e28;color:white}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid #453b2e}.item small{display:block;color:#b7a48a}.item strong{font-size:14px}.item .actions{margin:0}#notice{color:#e6bd71;min-height:25px}a{color:#e6bd71}#editor,#dashboard{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.item .actions{width:100%}header{align-items:flex-start;flex-direction:column}}</style></head><body><header><h1>✦ إدارة مطعم وجزارة الشويخي</h1><a href="/">العودة للموقع ←</a></header><main><p id="notice" role="status"></p><section class="panel" id="login"><h2>دخول المدير</h2><form id="loginForm"><label>اسم المستخدم<input id="username" value="admin" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button>تسجيل الدخول</button></form></section><section id="dashboard"><div class="panel"><h2>الأصناف والأسعار</h2><div class="actions"><button id="new">+ إضافة صنف</button><button class="secondary" id="refresh">تحديث</button><button class="secondary" id="logout">خروج</button></div><div id="items"></div></div><section class="panel" id="editor"><h2 id="editorTitle">إضافة صنف</h2><form id="itemForm"><div class="grid"><label>القائمة<select id="category"><option value="restaurant">المطعم</option><option value="butcher">الجزارة</option></select></label><label>القسم<input id="section" required maxlength="100" placeholder="المشويات بالكيلو"></label><label>اسم الصنف<input id="name" required maxlength="140"></label><label>السعر بالجنيه<input id="price" required type="number" min="0" step="0.01"></label><label>الوحدة<input id="unit" required placeholder="كيلو / قطعة / وجبة"></label><label>ترتيب العرض<input id="sort" type="number" value="0"></label><label>التوفر<select id="available"><option value="1">متاح</option><option value="0">مخفي مؤقتًا</option></select></label></div><div class="actions"><button>حفظ الصنف</button><button type="button" class="secondary" id="cancel">إلغاء</button></div></form></section><section class="panel"><h2>تغيير كلمة المرور</h2><form id="passwordForm" novalidate><p id="passwordNotice" role="status" aria-live="polite" style="color:#e6bd71;min-height:24px"></p><div class="grid"><p style="color:#d6c5a8">أنت مسجّل الدخول بالفعل. لتغيير كلمة المرور، أدخل كلمة المرور الجديدة وسيتم تسجيل خروج جميع الجلسات تلقائيًا.</p><label>كلمة مرور جديدة (١٢ حرفًا على الأقل)<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label></div><div class="actions"><button type="submit" id="changePasswordBtn">حفظ كلمة المرور الجديدة</button></div></form></section></section></main><script src="/admin.js" defer></script></body></html>
